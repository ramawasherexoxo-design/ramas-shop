<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Store Admin</title><link rel="stylesheet" href="/styles.css"><style>
.admin-wrap{max-width:1050px;margin:45px auto;padding:0 18px}.admin-card{background:#fff;padding:24px;margin:18px 0;border:1px solid var(--line)}.admin-form{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.admin-form input,.admin-form textarea{padding:12px;border:1px solid var(--line);width:100%;font:14px Arial}.admin-form textarea{grid-column:1/-1}.admin-form button{grid-column:1/-1}.admin-list{overflow:auto}.admin-list table{border-collapse:collapse;width:100%;font-size:13px}.admin-list td,.admin-list th{text-align:left;padding:12px;border-bottom:1px solid var(--line)}.pill{padding:4px 8px;background:#eee;border-radius:20px}.hidden{display:none}@media(max-width:600px){.admin-form{grid-template-columns:1fr}.admin-form textarea,.admin-form button{grid-column:auto}}
</style></head><body><header class="topbar"><a class="brand" href="/">NORTH <span>&</span> LANE</a><nav><a href="/">View store</a></nav></header>
<main class="admin-wrap"><p class="eyebrow">STORE MANAGEMENT</p><h1 style="font-size:45px">Admin dashboard</h1>
<section id="login" class="admin-card"><h2>Administrator sign in</h2><form id="loginForm" class="admin-form"><input name="username" placeholder="Username" required><input name="password" type="password" placeholder="Password" required><button class="button">Sign in</button></form><p id="loginError" class="error"></p></section>
<section id="dashboard" class="hidden"><div class="admin-card"><div style="display:flex;justify-content:space-between;align-items:center"><h2>Add a product</h2><button id="logout" class="text-button">Sign out</button></div><form id="productForm" class="admin-form"><input name="name" placeholder="Product name" required><input name="category" placeholder="Category" required><input name="price" type="number" step=".01" min="0" placeholder="Retail price (USD)" required><input name="supplierCost" type="number" step=".01" min="0" placeholder="Supplier product cost (USD)" required><input name="image" placeholder="Product image URL"><input name="supplierUrl" placeholder="Alibaba supplier/product URL"><textarea name="description" placeholder="Product description"></textarea><button class="button">Add product</button></form><p id="productMessage" class="fine"></p></div>
<div class="admin-card"><h2>Products</h2><div id="adminProducts" class="admin-list"></div></div>
<div class="admin-card"><h2>Orders & estimated margin</h2><p class="fine">Estimated margin = product sales − supplier item cost − entered shipping cost − entered payment fees. It is not accounting or tax advice.</p><div id="orders" class="admin-list"></div></div></section></main>
<script src="/admin.js"></script></body></html>
